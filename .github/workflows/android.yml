name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Superseded pushes to a pull request cancel their in-flight run; pushes to main always
# finish so the branch keeps a complete history of results.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + spotless)
        run: ./gradlew detekt spotlessCheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Lint
        run: ./gradlew :app:lintDebug

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache generated Android runtime
        uses: actions/cache@v4
        with:
          path: |
            build/generated/runtime-assets
            build/generated/runtime-jni
          key: and-code-runtime-${{ runner.os }}-${{ hashFiles('runtime_tools/termux_assets.lock.json', 'runtime_tools/termux_assets.py', 'scripts/prepare_android_runtime_*.py') }}

      - name: Validate runtime build scripts
        run: |
          python -m py_compile \
            runtime_tools/termux_assets.py \
            scripts/prepare_android_runtime_assets.py \
            scripts/prepare_android_runtime_native_libs.py
          python scripts/prepare_android_runtime_assets.py --help >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('runtime_tools/termux_assets.lock.json').read_text())
          assert lock['version'] == 1
          assert {'arm64-v8a', 'x86_64'} == set(lock['architectures'])
          assert all(item['packages'] for item in lock['architectures'].values())
          PY

      - name: Build debug APK
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: and-code-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-preview
          name: "yCode v1.0.2 Preview (Universal VPS & SSH Tunnel Support)"
          body: |
            ## yCode v1.0.2 Preview - Soporte Universal para Cualquier Servidor / VPS

            ### Mejoras Implementadas:
            - **Compatibilidad Universal con VPS**: Soporte para Ubuntu, Debian, Alpine (musl), CentOS/RHEL/Rocky/Alma, Arch, openSUSE y cualquier distro Linux moderna o antigua.
            - **Detección Automática de Arquitectura**: Autodetección de x86_64 (con soporte para procesadores antiguos sin AVX2), ARM64 (aarch64) y variantes musl libc.
            - **Configuración en 1 Solo Clic**: El usuario solo introduce sus credenciales SSH (Host, Puerto, Usuario, Contraseña o Llave privada) y la app detecta el entorno, instala OpenCode y configura el servicio automáticamente.
            - **Túnel SSH Encriptado Seguro (Port Forwarding)**: Conexión mediante túnel SSH local (`127.0.0.1:<puerto> -> VPS:127.0.0.1:4099`), garantizando funcionamiento incluso si la VPS está detrás de firewall NAT sin puertos públicos abiertos.
            - **Visor de Logs en Tiempo Real**: Registro detallado paso a paso visible en la interfaz para monitorear cada fase de la instalación.
            - **Análisis Estático y Lint Verificados**: 100% de tests y formato limpios con Spotless y Detekt.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test unit and instrumentation
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest --max-workers=2

      - name: Build release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease

      - name: Upload unsigned release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: and-code-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
